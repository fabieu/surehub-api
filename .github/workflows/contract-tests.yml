name: API contract tests

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  contract-tests:
    name: Validate upstream API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      - name: Install poetry
        run: pip install poetry==${{ vars.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run contract tests
        env:
          SUREHUB_EMAIL: ${{ secrets.SUREHUB_EMAIL }}
          SUREHUB_PASSWORD: ${{ secrets.SUREHUB_PASSWORD }}
        run: poetry run pytest tests/contract -v
